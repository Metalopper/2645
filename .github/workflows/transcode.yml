name: Video Transcoder Worker

on:
  workflow_dispatch:
    inputs:
      work_id:
        description: "Work ID"
        required: true
      source_url:
        description: "URL to download raw video from VPS"
        required: true
      callback_url:
        description: "VPS callback base URL"
        required: true

jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Report Runner Spun Up
        run: |
          API_KEY="${{ secrets.SERVER_CALLBACK_SECRET }}"
          [ -z "$API_KEY" ] && API_KEY="uniraw-callback-secret-8f92a34b9d0e21"
          curl -s -X POST "http://13.140.232.187:8095/api/uniraw/heartbeat" \
            -H "X-API-Key: $API_KEY" \
            -d "work_id=${{ inputs.work_id }}&stage=RUNNER_SPUN_UP&progress=10&run_id=${{ github.run_id }}&runner=${{ runner.name }}"

      - name: Install FFmpeg & Tools
        run: |
          mkdir -p work
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg aria2 jq zip
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Download Raw Video
        run: |
          cd work
          API_KEY="${{ secrets.SERVER_CALLBACK_SECRET }}"
          [ -z "$API_KEY" ] && API_KEY="uniraw-callback-secret-8f92a34b9d0e21"
          curl -s -X POST "http://13.140.232.187:8095/api/uniraw/heartbeat" \
            -H "X-API-Key: $API_KEY" \
            -d "work_id=${{ inputs.work_id }}&stage=DOWNLOADING&progress=20"
            
          aria2c -x 6 -s 6 --retry-wait=2 --max-tries=4 -o "source_video" "${{ inputs.source_url }}" || \
          curl -fSL -C - --retry 4 --retry-delay 2 -o "source_video" "${{ inputs.source_url }}"

      - name: Extract Metadata & Poster
        run: |
          cd work
          API_KEY="${{ secrets.SERVER_CALLBACK_SECRET }}"
          [ -z "$API_KEY" ] && API_KEY="uniraw-callback-secret-8f92a34b9d0e21"

          curl -s -X POST "http://13.140.232.187:8095/api/uniraw/heartbeat" \
            -H "X-API-Key: $API_KEY" \
            -d "work_id=${{ inputs.work_id }}&stage=EXTRACTING_METADATA&progress=28"

          # Extract poster thumbnail at 10s (or 0s fallback)
          ffmpeg -ss 00:00:10 -i source_video -vframes 1 -q:v 2 "thumbnail.jpg" || \
          ffmpeg -ss 00:00:00 -i source_video -vframes 1 -q:v 2 "thumbnail.jpg"

          # Extract technical metadata
          ffprobe -v quiet -print_format json -show_format -show_streams source_video > "technical_metadata.json"

          # Extract precise duration in seconds
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 source_video | cut -d. -f1)
          [ -z "$DUR" ] || [ "$DUR" -le 0 ] 2>/dev/null && DUR=1
          echo "TOTAL_DURATION=$DUR" >> $GITHUB_ENV
          echo "Total video duration detected: $DUR seconds"

      - name: Transcode Multi-Quality HLS Ladder (1080p, 720p, 480p)
        run: |
          cd work
          API_KEY="${{ secrets.SERVER_CALLBACK_SECRET }}"
          [ -z "$API_KEY" ] && API_KEY="uniraw-callback-secret-8f92a34b9d0e21"
          TOTAL_DUR=${TOTAL_DURATION:-1}

          # Initial transcode notification
          curl -s -X POST "http://13.140.232.187:8095/api/uniraw/heartbeat" \
            -H "X-API-Key: $API_KEY" \
            -d "work_id=${{ inputs.work_id }}&stage=TRANSCODING&progress=30"

          # Real frame-accurate progress monitor from ffmpeg out_time_us (30% -> 92%)
          rm -f /tmp/ff_progress_hls.txt
          (
            last_pct=30
            while true; do
              sleep 10
              if [ -f /tmp/ff_progress_hls.txt ]; then
                out_us=$(grep "out_time_us=" /tmp/ff_progress_hls.txt | tail -n 1 | cut -d= -f2)
                if [ -n "$out_us" ] && [ "$out_us" -gt 0 ] 2>/dev/null; then
                  sec_enc=$((out_us / 1000000))
                  calc_pct=$(awk -v enc="$sec_enc" -v dur="$TOTAL_DUR" 'BEGIN {
                    if (dur > 0) {
                      p = 30 + (enc / dur) * 62;
                      if (p > 92) p = 92;
                      printf "%d", p;
                    } else {
                      printf "30";
                    }
                  }')
                  if [ "$calc_pct" -gt "$last_pct" ]; then
                    last_pct=$calc_pct
                    curl -s -X POST "http://13.140.232.187:8095/api/uniraw/heartbeat" \
                      -H "X-API-Key: $API_KEY" \
                      -d "work_id=${{ inputs.work_id }}&stage=TRANSCODING&progress=$calc_pct" || true
                  fi
                fi
              fi
            done
          ) &
          HLS_MONITOR_PID=$!

          mkdir -p hls/1080p hls/720p hls/480p

          # Multi-bitrate HLS encoding: 1080p, 720p, 480p with keyframes locked every 48 frames (2s)
          ffmpeg -y -v warning -stats \
            -progress /tmp/ff_progress_hls.txt \
            -i source_video \
            -filter_complex \
            "[0:v]split=3[v1][v2][v3]; \
             [v1]scale='trunc(oh*a/2)*2:min(1080,ih)'[v1out]; \
             [v2]scale='trunc(oh*a/2)*2:min(720,ih)'[v2out]; \
             [v3]scale='trunc(oh*a/2)*2:min(480,ih)'[v3out]" \
            -map "[v1out]" -c:v:0 libx264 -preset veryfast -crf 23 -maxrate:v:0 2800k -bufsize:v:0 5600k -pix_fmt yuv420p -g 48 -keyint_min 48 -sc_threshold 0 \
            -map "[v2out]" -c:v:1 libx264 -preset veryfast -crf 25 -maxrate:v:1 1400k -bufsize:v:1 2800k -pix_fmt yuv420p -g 48 -keyint_min 48 -sc_threshold 0 \
            -map "[v3out]" -c:v:2 libx264 -preset veryfast -crf 27 -maxrate:v:2 800k -bufsize:v:2 1600k -pix_fmt yuv420p -g 48 -keyint_min 48 -sc_threshold 0 \
            -map 0:a:0? -c:a:0 aac -b:a:0 128k -ac 2 \
            -map 0:a:0? -c:a:1 aac -b:a:1 128k -ac 2 \
            -map 0:a:0? -c:a:2 aac -b:a:2 96k -ac 2 \
            -f hls \
            -hls_time 6 \
            -hls_playlist_type vod \
            -hls_flags independent_segments \
            -hls_segment_type mpegts \
            -hls_segment_filename "hls/%v/data%03d.ts" \
            -master_pl_name master.m3u8 \
            -var_stream_map "v:0,a:0,name:1080p v:1,a:1,name:720p v:2,a:2,name:480p" \
            hls/%v/index.m3u8

          kill $HLS_MONITOR_PID 2>/dev/null || true

          # Package pure HLS outputs into zip bundle (no redundant mp4)
          cd hls
          zip -r -0 ../hls_bundle.zip master.m3u8 1080p 720p 480p
          cd ..

      - name: Upload Finished Bundle to VPS
        run: |
          cd work
          API_KEY="${{ secrets.SERVER_CALLBACK_SECRET }}"
          [ -z "$API_KEY" ] && API_KEY="uniraw-callback-secret-8f92a34b9d0e21"

          curl -s -X POST "http://13.140.232.187:8095/api/uniraw/heartbeat" \
            -H "X-API-Key: $API_KEY" \
            -d "work_id=${{ inputs.work_id }}&stage=UPLOADING_BACK&progress=93"

          # Upload finished bundle directly to VPS port 8095 (bypassing Cloudflare completely)
          curl -f -X POST \
            --retry 5 \
            --retry-delay 3 \
            -H "X-API-Key: $API_KEY" \
            -F "work_id=${{ inputs.work_id }}" \
            -F "video=@hls_bundle.zip" \
            -F "thumbnail=@thumbnail.jpg" \
            -F "technical_metadata=@technical_metadata.json" \
            "http://13.140.232.187:8095/api/uniraw/complete"

      - name: Handle Failure
        if: failure()
        run: |
          API_KEY="${{ secrets.SERVER_CALLBACK_SECRET }}"
          [ -z "$API_KEY" ] && API_KEY="uniraw-callback-secret-8f92a34b9d0e21"
          curl -X POST "http://13.140.232.187:8095/api/uniraw/fail" \
            -H "X-API-Key: $API_KEY" \
            -d "work_id=${{ inputs.work_id }}&run_id=${{ github.run_id }}&error=Transcoding failed on runner" || true
